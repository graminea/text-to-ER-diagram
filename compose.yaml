services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      DB_PATH: /data/pilot.db
    volumes:
      - history:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"
      interval: 30s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 330s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ &&
          wget -q -O /dev/null http://127.0.0.1:8080/api/health
      interval: 30s
      timeout: 3s
      retries: 6
    stop_grace_period: 330s

volumes:
  history:
